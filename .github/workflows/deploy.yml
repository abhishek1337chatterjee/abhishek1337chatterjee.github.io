name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build main site
        run: npm run build
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_CHAT_API_URL: ${{ secrets.VITE_CHAT_API_URL }}

      - name: Install studio dependencies
        working-directory: studio
        run: npm ci

      - name: Build Sanity Studio
        working-directory: studio
        run: npx sanity build dist
        env:
          SANITY_STUDIO_BASEPATH: /studio

      - name: Fix studio asset paths
        working-directory: studio
        run: sed -i 's|href="/static/|href="/studio/static/|g; s|src="/static/|src="/studio/static/|g' dist/index.html

      - name: Copy studio to dist
        run: cp -r studio/dist dist/studio

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
